name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - claude/migrate-vercel-supabase-Mqic6
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # permite rodar manualmente pelo painel do GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        # A ação consulta a API do GitHub para descobrir a última versão da CLI.
        # Sem token essa consulta é anônima (60/h, compartilhada entre todos os
        # runners) e vira "rate limit exceeded". Autenticada, o limite é 1000/h.
        uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: latest

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploys every function under supabase/functions/ and respects the
          # per-function verify_jwt settings in supabase/config.toml
          supabase functions deploy --project-ref hzedbdiznmlnlxnmtoho
