name: Build Android APK

# Aperte "Run workflow" na aba Actions (workflow_dispatch) ou faça push de uma
# tag vX.Y.Z para gerar um APK. O APK final é publicado na aba Releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    # Também compila quando arquivos do app mudam nesta branch (gera APK sempre atual).
    branches:
      - 'claude/migrate-vercel-supabase-Mqic6'
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          # URL do projeto Supabase (fallback embutido — só a chave precisa de secret).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hzedbdiznmlnlxnmtoho.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Declare camera & location permissions in AndroidManifest
        # Sem estas declarações o Android NEGA as permissões na hora, sem nem
        # mostrar o diálogo — GPS e câmera ficam mortos no app.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|(<uses-permission android:name="android.permission.INTERNET" ?/>)|$1\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />|' "$MANIFEST"
          echo "--- AndroidManifest.xml após patch ---"
          cat "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST" || { echo "ERRO: patch de permissões não aplicado"; exit 1; }

      - name: Prepare splash source (2732x2732, logo centered on brand green)
        continue-on-error: true
        run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          convert assets/icon.png -resize 900x900 -background '#2f5d47' -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Generate app icons & splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2f5d47' --iconBackgroundColorDark '#2f5d47' --splashBackgroundColor '#2f5d47' --splashBackgroundColorDark '#1e3d2f'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release signing
        # Com a chave permanente (secrets) o APK é assinado sempre igual, então
        # dá para instalar a atualização POR CIMA. Sem os secrets, cai no debug
        # (assinatura muda a cada build → precisa desinstalar antes de atualizar).
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/pontzap-release.keystore
            cat >> android/app/build.gradle <<'GRADLE'

android {
    signingConfigs {
        release {
            storeFile file("pontzap-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "pontzap"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRADLE
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "APK será assinado com a chave permanente (atualização in-place OK)."
          else
            echo "mode=debug" >> $GITHUB_OUTPUT
            echo "AVISO: secrets de assinatura ausentes — gerando APK debug."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk pontzap-funcionario.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk pontzap-funcionario.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pontzap-funcionario-apk
          path: pontzap-funcionario.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          # workflow_dispatch não tem tag: usa uma release fixa "android-latest".
          # push de tag vX.Y.Z: usa a própria tag.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'PONTZAP Funcionário (última versão)' }}
          body: |
            APK do app do funcionário PONTZAP.

            **Como instalar:**
            1. Baixe o `pontzap-funcionario.apk` abaixo no celular Android.
            2. Toque no arquivo. O Android vai pedir para permitir "instalar de fontes desconhecidas" — permita.
            3. Abra o app e faça login com o e-mail e senha do funcionário.
          files: pontzap-funcionario.apk
          prerelease: false
